version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gotrain_postgres
    environment:
      POSTGRES_USER: gotrain
      POSTGRES_PASSWORD: gotrain_password
      POSTGRES_DB: gotrain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotrain_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gotrain_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_PORT: "8080"
      DB_DSN: "postgres://gotrain:gotrain_password@postgres:5432/gotrain_db?sslmode=disable"
      JWT_SECRET: "your-secret-jwt-key-change-in-production"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    volumes:
      - ./migrations:/app/migrations:ro
    networks:
      - gotrain_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gotrain_network:
    driver: bridge

